</g>
<polyline points="220,123 475,130 730,170" fill="none" stroke="#2da44e" stroke-width="3" stroke-linejoin="round"/>
<polyline points="220,166 475,237 730,287" fill="none" stroke="#e5534b" stroke-width="3" stroke-linejoin="round"/>
