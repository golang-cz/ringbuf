<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Highest sustained rate with 1 in 10 subscribers slow. At 1,000 subscribers ringbuf sustains 128,000 messages per second and Go channels 14,700. At 10,000 subscribers 90,500 against 420. At 100,000 subscribers 12,300 against 35.">
<text x="40" y="30" font-size="17" font-weight="600" fill="#768390">Highest sustained rate, messages per second</text>
<text x="40" y="50" font-size="12" fill="#768390">1 in 10 subscribers is slow. Fast subscribers get at least 99% of the messages, under one second old. Log scale.</text>
<g stroke="#768390" stroke-opacity="0.25" stroke-width="1">
