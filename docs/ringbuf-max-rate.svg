<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Highest sustained rate with 1 in 10 subscribers slow. At 1,000 subscribers ringbuf sustains 256,000 messages per second and Go channels 13,500. At 10,000 subscribers 256,000 against 2,180. At 100,000 subscribers 38,100 against 28.">
<text x="40" y="30" font-size="17" font-weight="600" fill="#768390">Highest sustained rate, messages per second</text>
<text x="40" y="50" font-size="12" fill="#768390">1 in 10 subscribers is slow. Fast subscribers get at least 99% of the messages, under one second old. Log scale.</text>
