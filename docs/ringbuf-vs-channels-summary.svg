<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 214" width="920" height="214" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Fan-out to 100,000 subscribers. With 1 in 10 subscribers slow, ringbuf delivers 1,000 messages per second and Go channels 20. Publishing one message takes Go channels 20 ms and ringbuf 0.1 microseconds. Buffers take 926 MB with Go channels and 8.6 MB with ringbuf.">
<text x="40.0" y="26.0" font-size="14" font-weight="600" fill="#768390">ringbuf vs. Go channels, streaming to 100,000 subscribers</text>
<text x="40.0" y="70.0" font-size="18" font-weight="700" fill="#2da44e">50x the throughput</text>
<text x="40.0" y="89.0" font-size="12.5" fill="#768390">when 1 in 10 subscribers is slow</text>
<text x="40.0" y="118.0" font-size="12.5" font-weight="600" fill="#2da44e">ringbuf</text>
<text x="302.0" y="118.0" font-size="12.5" text-anchor="end" font-weight="600" fill="#2da44e">1,000 msg/s</text>
<rect x="40" y="125" width="262" height="12" rx="3" fill="#768390" fill-opacity="0.15"/>
<rect x="40" y="125" width="262.0" height="12" rx="3" fill="#2da44e"/>
<text x="40.0" y="162.0" font-size="12.5" font-weight="600" fill="#e5534b">Go channels</text>
<text x="302.0" y="162.0" font-size="12.5" text-anchor="end" font-weight="600" fill="#e5534b">20 msg/s</text>
<rect x="40" y="169" width="262" height="12" rx="3" fill="#768390" fill-opacity="0.15"/>
<rect x="40" y="169" width="5.4" height="12" rx="3" fill="#e5534b"/>
<text x="329.0" y="70.0" font-size="18" font-weight="700" fill="#2da44e">140,000x faster writes</text>
<text x="329.0" y="89.0" font-size="12.5" fill="#768390">time to publish one message</text>
<text x="329.0" y="118.0" font-size="12.5" font-weight="600" fill="#2da44e">ringbuf</text>
<text x="591.0" y="118.0" font-size="12.5" text-anchor="end" font-weight="600" fill="#2da44e">0.1 µs</text>
<rect x="329" y="125" width="262" height="12" rx="3" fill="#768390" fill-opacity="0.15"/>
<rect x="329" y="125" width="3.0" height="12" rx="3" fill="#2da44e"/>
<text x="329.0" y="162.0" font-size="12.5" font-weight="600" fill="#e5534b">Go channels</text>
<text x="591.0" y="162.0" font-size="12.5" text-anchor="end" font-weight="600" fill="#e5534b">20 ms</text>
<rect x="329" y="169" width="262" height="12" rx="3" fill="#768390" fill-opacity="0.15"/>
<rect x="329" y="169" width="262.0" height="12" rx="3" fill="#e5534b"/>
<text x="618.0" y="70.0" font-size="18" font-weight="700" fill="#2da44e">108x less memory</text>
<text x="618.0" y="89.0" font-size="12.5" fill="#768390">for all subscriber buffers</text>
<text x="618.0" y="118.0" font-size="12.5" font-weight="600" fill="#2da44e">ringbuf</text>
<text x="880.0" y="118.0" font-size="12.5" text-anchor="end" font-weight="600" fill="#2da44e">8.6 MB</text>
<rect x="618" y="125" width="262" height="12" rx="3" fill="#768390" fill-opacity="0.15"/>
<rect x="618" y="125" width="3.0" height="12" rx="3" fill="#2da44e"/>
<text x="618.0" y="162.0" font-size="12.5" font-weight="600" fill="#e5534b">Go channels</text>
<text x="880.0" y="162.0" font-size="12.5" text-anchor="end" font-weight="600" fill="#e5534b">926 MB</text>
<rect x="618" y="169" width="262" height="12" rx="3" fill="#768390" fill-opacity="0.15"/>
<rect x="618" y="169" width="262.0" height="12" rx="3" fill="#e5534b"/>
</svg>
