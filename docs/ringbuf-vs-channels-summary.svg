<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 296" width="880" height="296" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="At 100,000 subscribers, ringbuf has 50 times the throughput, 140,000 times faster writes and 108 times lower memory use, compared to Go channels.">
<text x="28" y="36" font-size="22" font-weight="600" fill="#768390">At 100,000 subscribers, ringbuf has</text>
<text x="28" y="92" font-size="40" font-weight="700" fill="#2da44e">50x</text>
<text x="28" y="120" font-size="21" font-weight="600" fill="#2da44e">the throughput</text>
<text x="28" y="142" font-size="14" fill="#768390">with 1 in 10 subscribers slow</text>
<text x="28" y="176" font-size="15" font-weight="600" fill="#2da44e">ringbuf</text>
<text x="280" y="176" font-size="15" text-anchor="end" font-weight="600" fill="#2da44e">1,000 msg/s</text>
<rect x="28" y="184" width="252" height="14" rx="3" fill="#768390" fill-opacity="0.15"/>
<rect x="28" y="184" width="252" height="14" rx="3" fill="#2da44e"/>
<text x="28" y="222" font-size="15" font-weight="600" fill="#e5534b">Go channels</text>
<text x="280" y="222" font-size="15" text-anchor="end" font-weight="600" fill="#e5534b">20 msg/s</text>
<rect x="28" y="230" width="252" height="14" rx="3" fill="#768390" fill-opacity="0.15"/>
<rect x="28" y="230" width="5" height="14" rx="3" fill="#e5534b"/>
<text x="314" y="92" font-size="40" font-weight="700" fill="#2da44e">140,000x</text>
<text x="314" y="120" font-size="21" font-weight="600" fill="#2da44e">faster writes</text>
<text x="314" y="142" font-size="14" fill="#768390">time to publish one message</text>
<text x="314" y="176" font-size="15" font-weight="600" fill="#2da44e">ringbuf</text>
<text x="566" y="176" font-size="15" text-anchor="end" font-weight="600" fill="#2da44e">0.1 µs</text>
<rect x="314" y="184" width="252" height="14" rx="3" fill="#768390" fill-opacity="0.15"/>
<rect x="314" y="184" width="4" height="14" rx="3" fill="#2da44e"/>
<text x="314" y="222" font-size="15" font-weight="600" fill="#e5534b">Go channels</text>
<text x="566" y="222" font-size="15" text-anchor="end" font-weight="600" fill="#e5534b">20 ms</text>
<rect x="314" y="230" width="252" height="14" rx="3" fill="#768390" fill-opacity="0.15"/>
<rect x="314" y="230" width="252" height="14" rx="3" fill="#e5534b"/>
<text x="600" y="92" font-size="40" font-weight="700" fill="#2da44e">108x</text>
<text x="600" y="120" font-size="21" font-weight="600" fill="#2da44e">lower memory use</text>
<text x="600" y="142" font-size="14" fill="#768390">for all subscriber buffers</text>
<text x="600" y="176" font-size="15" font-weight="600" fill="#2da44e">ringbuf</text>
<text x="852" y="176" font-size="15" text-anchor="end" font-weight="600" fill="#2da44e">8.6 MB</text>
<rect x="600" y="184" width="252" height="14" rx="3" fill="#768390" fill-opacity="0.15"/>
<rect x="600" y="184" width="4" height="14" rx="3" fill="#2da44e"/>
<text x="600" y="222" font-size="15" font-weight="600" fill="#e5534b">Go channels</text>
<text x="852" y="222" font-size="15" text-anchor="end" font-weight="600" fill="#e5534b">926 MB</text>
<rect x="600" y="230" width="252" height="14" rx="3" fill="#768390" fill-opacity="0.15"/>
<rect x="600" y="230" width="252" height="14" rx="3" fill="#e5534b"/>
<text x="852" y="278" font-size="22" text-anchor="end" font-weight="600" fill="#768390">…compared to Go channels</text>
</svg>
