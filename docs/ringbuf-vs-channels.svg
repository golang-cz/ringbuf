<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 450" width="920" height="450" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Publishing one item to up to 100,000 subscribers. With Go channels the writer needs 16 ms per item and the buffers hold 926 MB. With ringbuf the writer needs 66 ns and the buffer holds 8.6 MB.">
<text x="62" y="26" font-size="17" font-weight="600" fill="#768390">Publishing one item to every subscriber: Go channels vs. ringbuf</text>
<text x="62" y="46" font-size="12" fill="#768390">An item is one uint64 (8 bytes). Buffers hold 1,024 items. Linear scale, lower is better. Measured on an Apple M4 Pro.</text>
<text x="62" y="86" font-size="14" font-weight="600" fill="#768390">Time the writer needs per item</text>
<line x1="62" y1="392.0" x2="338" y2="392.0" stroke="#768390" stroke-opacity="0.25" stroke-width="1"/>
<text x="54" y="396.0" font-size="11" text-anchor="end" fill="#768390">0</text>
<line x1="62" y1="314.2" x2="338" y2="314.2" stroke="#768390" stroke-opacity="0.25" stroke-width="1"/>
<text x="54" y="318.2" font-size="11" text-anchor="end" fill="#768390">5 ms</text>
<line x1="62" y1="236.4" x2="338" y2="236.4" stroke="#768390" stroke-opacity="0.25" stroke-width="1"/>
<text x="54" y="240.4" font-size="11" text-anchor="end" fill="#768390">10 ms</text>
<line x1="62" y1="158.7" x2="338" y2="158.7" stroke="#768390" stroke-opacity="0.25" stroke-width="1"/>
<text x="54" y="162.7" font-size="11" text-anchor="end" fill="#768390">15 ms</text>
