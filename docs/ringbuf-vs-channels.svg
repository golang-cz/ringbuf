<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 150" width="920" height="150" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="ringbuf against Go channels at 100,000 subscribers: 1,000 messages per second where channels manage 20, 140,000 times less writer time, 108 times less memory.">
<text x="40.0" y="24.0" font-size="13" font-weight="600" fill="#768390">ringbuf vs. Go channels at 100,000 subscribers</text>
<rect x="40" y="38" width="268" height="100" rx="10" fill="#2da44e" fill-opacity="0.10" stroke="#2da44e" stroke-opacity="0.45"/>
<text x="58.0" y="82.0" font-size="32" font-weight="700" fill="#2da44e">1,000 msg/s</text>
<text x="58.0" y="105.0" font-size="12.5" fill="#768390">with 10,000 slow subscribers.</text>
<text x="58.0" y="122.0" font-size="12.5" fill="#768390">Go channels: 20 msg/s.</text>
<rect x="326" y="38" width="268" height="100" rx="10" fill="#2da44e" fill-opacity="0.10" stroke="#2da44e" stroke-opacity="0.45"/>
<text x="344.0" y="82.0" font-size="32" font-weight="700" fill="#2da44e">140,000x</text>
<text x="344.0" y="105.0" font-size="12.5" fill="#768390">less writer time per message.</text>
<text x="344.0" y="122.0" font-size="12.5" fill="#768390">0.1 µs, not 20 ms.</text>
<rect x="612" y="38" width="268" height="100" rx="10" fill="#2da44e" fill-opacity="0.10" stroke="#2da44e" stroke-opacity="0.45"/>
<text x="630.0" y="82.0" font-size="32" font-weight="700" fill="#2da44e">108x</text>
<text x="630.0" y="105.0" font-size="12.5" fill="#768390">less memory.</text>
<text x="630.0" y="122.0" font-size="12.5" fill="#768390">8.6 MB, not 926 MB.</text>
</svg>
