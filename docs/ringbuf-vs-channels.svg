<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1090" width="920" height="1090" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="One writer streaming to 100,000 subscribers, 1 in 10 of them slow clients. ringbuf keeps publishing 1,000 items per second and Go channels drop to about 20. ringbuf needs 140,000 times less writer time and 108 times less memory.">
<text x="40.0" y="30.0" font-size="19" font-weight="700" fill="#768390">One stream, 100,000 subscribers: ringbuf vs. Go channels</text>
<text x="40.0" y="52.0" font-size="12" fill="#768390">One writer. Go channels: one buffered channel per subscriber, the usual fan-out. ringbuf: one shared buffer. Measured on an Apple M4 Pro.</text>
<rect x="40" y="72" width="268" height="118" rx="10" fill="#2da44e" fill-opacity="0.10" stroke="#2da44e" stroke-opacity="0.45"/>
<text x="58.0" y="116.0" font-size="32" font-weight="700" fill="#2da44e">1,000 items/s</text>
<text x="58.0" y="140.0" font-size="12.5" fill="#768390">ringbuf still delivers the full stream</text>
<text x="58.0" y="157.0" font-size="12.5" fill="#768390">when 10,000 subscribers are slow clients.</text>
<text x="58.0" y="174.0" font-size="12.5" fill="#768390">Go channels: 20 items/s.</text>
<rect x="326" y="72" width="268" height="118" rx="10" fill="#2da44e" fill-opacity="0.10" stroke="#2da44e" stroke-opacity="0.45"/>
<text x="344.0" y="116.0" font-size="32" font-weight="700" fill="#2da44e">140,000x</text>
<text x="344.0" y="140.0" font-size="12.5" fill="#768390">less time per item for the writer:</text>
<text x="344.0" y="157.0" font-size="12.5" fill="#768390">0.1 µs, not 20 ms.</text>
<text x="344.0" y="174.0" font-size="12.5" fill="#768390">Flat, however many subscribe.</text>
<rect x="612" y="72" width="268" height="118" rx="10" fill="#2da44e" fill-opacity="0.10" stroke="#2da44e" stroke-opacity="0.45"/>
<text x="630.0" y="116.0" font-size="32" font-weight="700" fill="#2da44e">108x</text>
<text x="630.0" y="140.0" font-size="12.5" fill="#768390">less memory for buffers:</text>
<text x="630.0" y="157.0" font-size="12.5" fill="#768390">8.6 MB, not 926 MB.</text>
<text x="630.0" y="174.0" font-size="12.5" fill="#768390">One shared buffer, no copies.</text>
<text x="40.0" y="232.0" font-size="15" font-weight="700" fill="#768390">Real audiences have slow clients: phones on weak networks, bad Wi-Fi, background browser tabs</text>
<text x="40.0" y="252.0" font-size="12" fill="#768390">Simulated here: 1 in 10 subscribers can take only 10 items per second. The writer wants to send 1,000 items per second to everyone.</text>
<text x="40.0" y="270.0" font-size="12" fill="#768390">Go channels here skip an item when a subscriber is full. Without that, the writer waits for the slowest client: about 10 items per second.</text>
<text x="92.0" y="310.0" font-size="14" font-weight="600" fill="#768390">Does the stream stay at full speed?</text>
<text x="92.0" y="327.0" font-size="11.5" fill="#768390">Items per second the writer gets out, of the 1,000 it wants to send. Higher is better.</text>
<line x1="92" y1="498.0" x2="720" y2="498.0" stroke="#768390" stroke-opacity="0.25"/>
<text x="84.0" y="502.0" font-size="11" text-anchor="end" fill="#768390">0</text>
<line x1="92" y1="461.2" x2="720" y2="461.2" stroke="#768390" stroke-opacity="0.25"/>
<text x="84.0" y="465.2" font-size="11" text-anchor="end" fill="#768390">250</text>
<line x1="92" y1="424.4" x2="720" y2="424.4" stroke="#768390" stroke-opacity="0.25"/>
<text x="84.0" y="428.4" font-size="11" text-anchor="end" fill="#768390">500</text>
<line x1="92" y1="387.5" x2="720" y2="387.5" stroke="#768390" stroke-opacity="0.25"/>
<text x="84.0" y="391.5" font-size="11" text-anchor="end" fill="#768390">750</text>
