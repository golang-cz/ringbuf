<text x="710.0" y="303.9" font-size="11.5" fill="#2da44e">keeps the pace</text>
<text x="92.0" y="522.0" font-size="14" font-weight="600" fill="#768390">Time the writer needs per item</text>
<text x="92.0" y="539.0" font-size="11.5" fill="#768390">Every subscriber keeps up. Lower is better.</text>
