<text x="348.0" y="157.1" font-size="13" fill="#e5534b">16 ms</text>
<polyline points="62.0,392.0 62.3,392.0 64.8,392.0 89.6,392.0 338.0,392.0" fill="none" stroke="#2f81f7" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
