<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 760" width="920" height="760" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="One writer streaming to 100,000 subscribers, 1 in 10 on a very slow connection. ringbuf keeps publishing 1,000 items per second; Go channels drop to about 20. ringbuf needs 140,000 times less writer time and 108 times less memory.">
<text x="40.0" y="30.0" font-size="19" font-weight="700" fill="#768390">One stream, 100,000 subscribers: ringbuf vs. Go channels</text>
<text x="40.0" y="52.0" font-size="12" fill="#768390">One writer, one buffered channel per subscriber (the usual Go fan-out) against one shared ringbuf. Measured on an Apple M4 Pro.</text>
<rect x="40" y="72" width="268" height="118" rx="10" fill="#2da44e" fill-opacity="0.10" stroke="#2da44e" stroke-opacity="0.45"/>
<text x="58.0" y="116.0" font-size="32" font-weight="700" fill="#2da44e">1,000 items/s</text>
<text x="58.0" y="140.0" font-size="12.5" fill="#768390">ringbuf still delivers the full stream</text>
<text x="58.0" y="157.0" font-size="12.5" fill="#768390">when 10,000 of the subscribers are slow.</text>
<text x="58.0" y="174.0" font-size="12.5" fill="#768390">Go channels: 20 items/s.</text>
<rect x="326" y="72" width="268" height="118" rx="10" fill="#2da44e" fill-opacity="0.10" stroke="#2da44e" stroke-opacity="0.45"/>
<text x="344.0" y="116.0" font-size="32" font-weight="700" fill="#2da44e">140,000x</text>
<text x="344.0" y="140.0" font-size="12.5" fill="#768390">less time per item for the writer:</text>
<text x="344.0" y="157.0" font-size="12.5" fill="#768390">0.1 µs, not 20 ms.</text>
<text x="344.0" y="174.0" font-size="12.5" fill="#768390">Flat, however many subscribe.</text>
<rect x="612" y="72" width="268" height="118" rx="10" fill="#2da44e" fill-opacity="0.10" stroke="#2da44e" stroke-opacity="0.45"/>
<text x="630.0" y="116.0" font-size="32" font-weight="700" fill="#2da44e">108x</text>
<text x="630.0" y="140.0" font-size="12.5" fill="#768390">less memory for buffers:</text>
<text x="630.0" y="157.0" font-size="12.5" fill="#768390">8.6 MB, not 926 MB.</text>
<text x="630.0" y="174.0" font-size="12.5" fill="#768390">One shared buffer, no copies.</text>
<text x="92.0" y="236.0" font-size="14" font-weight="600" fill="#768390">Can the stream keep its pace when some connections are very slow?</text>
<text x="92.0" y="253.0" font-size="11.5" fill="#768390">Items per second the writer gets out, of 1,000 asked. 1 in 10 subscribers takes 100 ms per item, like a modem. Higher is better.</text>
