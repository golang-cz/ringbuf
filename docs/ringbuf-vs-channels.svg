<text x="730.0" y="375.8" font-size="11.5" fill="#2da44e">full speed</text>
<text x="92.0" y="582.0" font-size="14" font-weight="600" fill="#768390">Do the fast subscribers notice the slow ones?</text>
<text x="92.0" y="599.0" font-size="11.5" fill="#768390">Age of an item when a fast subscriber gets it, 99th percentile. The test runs 5 seconds. Lower is better.</text>
