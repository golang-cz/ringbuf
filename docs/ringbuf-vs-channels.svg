<text x="131.0" y="410" font-size="11" text-anchor="middle" fill="#768390">25,000</text>
<text x="200.0" y="410" font-size="11" text-anchor="middle" fill="#768390">50,000</text>
<text x="269.0" y="410" font-size="11" text-anchor="middle" fill="#768390">75,000</text>
<text x="338.0" y="410" font-size="11" text-anchor="middle" fill="#768390">100,000</text>
<text x="200.0" y="432" font-size="12" text-anchor="middle" fill="#768390">subscribers</text>
